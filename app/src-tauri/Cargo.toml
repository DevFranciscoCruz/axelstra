[package]
name = "axelstra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
axelstra-daemon = { path = "../../crates/daemon" }
axelstra-core = { path = "../../crates/core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
arboard = "3"
png = "0.18"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }
ureq = "2"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_Performance"] }
