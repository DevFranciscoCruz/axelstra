name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the app crate needs the desktop toolkit; the engine crates (daemon, orchestrator, CLI) do not
      - name: Engine tests
        run: cargo test --no-fail-fast -p axelstra-core -p axelstra-daemon -p axelstra
  host:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # catches host (Tauri) compile errors on every push instead of at release time
      - run: cargo check -p axelstra-app
      # host unit tests, including the daemon_call allow-list against the frontend sources
      - run: cargo test --release -p axelstra-app
      # the debug test exe links the release CRT too (see app/src-tauri/build.rs)
      - run: cargo test -p axelstra-app
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
