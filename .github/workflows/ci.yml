name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the app crate needs the desktop toolkit; the engine crates (daemon, orchestrator, CLI) do not
      - name: Engine tests
        run: cargo test -p axelstra-core -p axelstra-daemon -p axelstra
