name: release
# Push a tag `vX.Y.Z` to build the installer and attach it to the GitHub Release. Installs and
# updates are manual: download Axelstra_<version>_x64-setup.exe from the release and run it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; keep the installer on the run, publish nothing
        type: boolean
        default: true
permissions: { contents: write }
jobs:
  release:
    # Swap for the self-hosted runner label if the repo gets access to one.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: npm ci
        working-directory: app
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "bad tag $GITHUB_REF_NAME"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Daemon sidecar
        run: powershell -NoProfile -File scripts/prepare-sidecar.ps1
      - name: Build the installer
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe out/
          sha256sum out/*-setup.exe
      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*-setup.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/*-setup.exe --title "Axelstra $V" --notes "Axelstra $V"
          fi
      - name: Keep the dry-run installer on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: axelstra-dry-run
          path: out/
          retention-days: 7
