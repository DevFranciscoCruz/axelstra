name: release
# Push a tag `vX.Y.Z` to build the installers and attach them to the GitHub Release. Installs and
# updates are manual: download Axelstra_<version>_x64-setup.exe (Windows) or the .dmg (macOS, Apple
# silicon) from the release. The macOS build is not signed or notarized: see the README.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; keep the installer on the run, publish nothing
        type: boolean
        default: true
permissions: { contents: write }
jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # Swap for the self-hosted runner label if the repo gets access to one.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast -p axelstra-core -p axelstra-daemon -p axelstra
      - run: npm ci
        working-directory: app
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "bad tag $GITHUB_REF_NAME"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Daemon sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/prepare-sidecar.ps1
      - name: Daemon sidecar (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/prepare-sidecar.sh
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      - name: Build the disk image (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: npx tauri build --bundles dmg --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          if [[ "$RUNNER_OS" == "Windows" ]]; then cp target/release/bundle/nsis/*-setup.exe out/; else cp target/release/bundle/dmg/*.dmg out/; fi
          ls -l out
      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          # both matrix jobs get here: whoever is first creates the release, the other uploads into it
          gh release create "$GITHUB_REF_NAME" --title "Axelstra $V" --notes "Axelstra $V" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Keep the dry-run installer on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: axelstra-dry-run-${{ runner.os }}
          path: out/
          retention-days: 7
