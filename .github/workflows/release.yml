name: release
# Push a tag `vX.Y.Z` to build the installers and attach them to the GitHub Release. The Windows
# installer and the macOS .app.tar.gz are signed for the in-app updater; a last job merges the platform
# entries into latest.json, which the app reads from releases/latest/download. The macOS app is signed
# with a Developer ID and notarized when the Apple secrets exist (see the README), unsigned otherwise.
#
# Needed in the repo settings: secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# For a signed macOS build also: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific password) and APPLE_TEAM_ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; keep the installer on the run, publish nothing
        type: boolean
        default: true
permissions: { contents: write }
jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # Swap for the self-hosted runner label if the repo gets access to one.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --no-fail-fast -p axelstra-core -p axelstra-daemon -p axelstra
      - run: npm ci
        working-directory: app
      # the installer must not ship a frontend that fails its own checks
      - run: npx tsc --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "bad tag $GITHUB_REF_NAME"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Changelog
        shell: bash
        run: |
          # the commit subjects since the previous release tag
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME:-HEAD}^" 2>/dev/null || true)
          {
            echo "## What's changed"
            echo
            if [[ -n "$PREV" ]]; then git log --no-merges --pretty='- %s' "$PREV..HEAD"; else git log --no-merges -n 20 --pretty='- %s'; fi
            if [[ -n "$PREV" ]]; then echo; echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$PREV...${GITHUB_REF_NAME:-HEAD}"; fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Daemon sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/prepare-sidecar.ps1
      - name: Daemon sidecar (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/prepare-sidecar.sh

      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      # macOS: the .app.tar.gz is what the in-app updater downloads, the .dmg is the first install.
      # With the Apple secrets set the app is signed with the Developer ID and notarized; without them it
      # is built unsigned, as before.
      - name: Build the app and disk image (macOS, signed)
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      - name: Build the app and disk image (macOS, unsigned)
        if: runner.os == 'macOS' && env.HAS_APPLE != 'true'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/bundle/nsis/*-setup.exe out/
            FILE=$(basename out/*-setup.exe)
            cp "target/release/bundle/nsis/$FILE.sig" "out/$FILE.sig"
            KEY=windows-x86_64
          else
            cp target/release/bundle/dmg/*.dmg out/
            cp target/release/bundle/macos/*.app.tar.gz out/
            FILE=$(basename out/*.app.tar.gz)
            cp "target/release/bundle/macos/$FILE.sig" "out/$FILE.sig"
            KEY=darwin-aarch64
          fi
          # this platform's entry for latest.json, merged by the manifest job once every platform is up
          node scripts/write-latest-json.mjs --fragment --key "$KEY" --sig-file "out/$FILE.sig"             --url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME:-v0.0.0}/$FILE" --out "out/platform-$KEY.json"
          ls -l out
      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          # both matrix jobs get here: whoever is first creates the release, the other uploads into it
          gh release create "$GITHUB_REF_NAME" --title "Axelstra $V" --notes-file "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Keep the dry-run installer on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axelstra-dry-run-${{ runner.os }}
          path: out/
          retention-days: 7

  # EXPERIMENTAL: Linux is not a supported platform yet. This job only proves a .deb and an AppImage can be built;
  # it never blocks the release, and the files are not signed for the updater, so latest.json has no Linux entry
  # (a Linux install does not update itself). Nobody has run the result on a Linux desktop.
  linux:
    name: release (linux, experimental)
    # after the main jobs, which create the release and write its notes
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Desktop toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: cargo test --no-fail-fast -p axelstra-core -p axelstra-daemon -p axelstra
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Version
        id: v
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Daemon sidecar
        run: sh scripts/prepare-sidecar.sh
      - name: Build the .deb and the AppImage
        working-directory: app
        # sherpa-rs-sys links its static libs and refuses to build on Linux without this
        env:
          RUSTFLAGS: -C relocation-model=dynamic-no-pic
        run: npx tauri build --config src-tauri/tauri.release.linux.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      - name: Stage artifacts
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb out/
          cp target/release/bundle/appimage/*.AppImage out/
          ls -l out
      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Keep the dry-run files on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axelstra-dry-run-Linux
          path: out/
          retention-days: 7

  # latest.json goes last: clients only see a version once every installer is already there
  manifest:
    name: latest.json
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - name: Merge the platform entries
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir frag
          gh release download "$GITHUB_REF_NAME" --pattern 'platform-*.json' --dir frag
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          node scripts/write-latest-json.mjs --version "$V" --notes-file notes.md --out latest.json frag/platform-*.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          for f in frag/platform-*.json; do gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$f")" --yes; done
