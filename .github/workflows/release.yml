name: release
# Push a tag `vX.Y.Z` to build, sign and publish. The installer and latest.json go to a public
# Cloudflare R2 bucket because the repo is private: the app's updater cannot read GitHub releases.
# Same layout as ScorpioBotsPanel: releases/<version>/setup.exe(.sig) + latest.json.
#
# Needed in the repo settings:
#   secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
#            R2_UPDATES_ACCESS_KEY_ID, R2_UPDATES_SECRET_ACCESS_KEY
#   vars:    R2_ACCOUNT_ID, R2_BUCKET (e.g. axelstra-releases), UPDATES_BASE_URL (public URL of the bucket)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; keep the installer on the run, publish nothing
        type: boolean
        default: true
permissions: { contents: read }
jobs:
  release:
    # Swap for the self-hosted runner label if the repo gets access to one.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: npm ci
        working-directory: app
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "bad tag $GITHUB_REF_NAME"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Daemon sidecar
        run: powershell -NoProfile -File scripts/prepare-sidecar.ps1
      - name: Build the signed installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      - name: Stage artifacts
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          B="target/release/bundle/nsis"
          mkdir -p "out/releases/$V"
          cp "$B"/*-setup.exe "out/releases/$V/setup.exe"
          cp "$B"/*-setup.exe.sig "out/releases/$V/setup.exe.sig"
          node scripts/write-latest-json.mjs --version "$V" --sig-file "out/releases/$V/setup.exe.sig" \
            --base-url "${{ vars.UPDATES_BASE_URL }}" --notes "Axelstra $V" --out out/latest.json
          sha256sum "out/releases/$V/setup.exe"
      - name: Upload to R2
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_UPDATES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_UPDATES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          E="https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp out/releases "s3://${{ vars.R2_BUCKET }}/releases" --recursive --endpoint-url "$E"
          # latest.json last: clients only see a version once its installer is already there
          aws s3 cp out/latest.json "s3://${{ vars.R2_BUCKET }}/latest.json" --endpoint-url "$E" --content-type application/json
      - name: Keep the dry-run installer on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: axelstra-dry-run
          path: out/
          retention-days: 7
