name: release
# Push a tag `vX.Y.Z` to build the installers and attach them to the GitHub Release. The Windows
# installer is signed for the in-app updater and the release also carries latest.json, which the app
# reads from releases/latest/download. The .dmg (macOS, Apple silicon) is installed manually and is
# not signed or notarized: see the README.
#
# Needed in the repo settings: secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; keep the installer on the run, publish nothing
        type: boolean
        default: true
permissions: { contents: write }
jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # Swap for the self-hosted runner label if the repo gets access to one.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast -p axelstra-core -p axelstra-daemon -p axelstra
      - run: npm ci
        working-directory: app
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "bad tag $GITHUB_REF_NAME"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Changelog
        shell: bash
        run: |
          # the commit subjects since the previous release tag
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME:-HEAD}^" 2>/dev/null || true)
          {
            echo "## What's changed"
            echo
            if [[ -n "$PREV" ]]; then git log --no-merges --pretty='- %s' "$PREV..HEAD"; else git log --no-merges -n 20 --pretty='- %s'; fi
            if [[ -n "$PREV" ]]; then echo; echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$PREV...${GITHUB_REF_NAME:-HEAD}"; fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Daemon sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/prepare-sidecar.ps1
      - name: Daemon sidecar (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/prepare-sidecar.sh
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      - name: Build the disk image (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: npx tauri build --bundles dmg --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/bundle/nsis/*-setup.exe out/
            EXE=$(basename out/*-setup.exe)
            cp "target/release/bundle/nsis/$EXE.sig" "out/$EXE.sig"
            node scripts/write-latest-json.mjs --version "${{ steps.v.outputs.version }}" --sig-file "out/$EXE.sig"               --url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME:-v0.0.0}/$EXE"               --notes "$(cat "$RUNNER_TEMP/notes.md")" --out out/latest.json
          else
            cp target/release/bundle/dmg/*.dmg out/
          fi
          ls -l out
      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          # both matrix jobs get here: whoever is first creates the release, the other uploads into it
          gh release create "$GITHUB_REF_NAME" --title "Axelstra $V" --notes-file "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          # latest.json goes last: clients only see a version once its installer is already there
          gh release upload "$GITHUB_REF_NAME" $(ls out/* | grep -v latest.json) --clobber
          if [[ -f out/latest.json ]]; then gh release upload "$GITHUB_REF_NAME" out/latest.json --clobber; fi
      - name: Keep the dry-run installer on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: axelstra-dry-run-${{ runner.os }}
          path: out/
          retention-days: 7
