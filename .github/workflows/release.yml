name: release
# Builds the installers for a `vX.Y.Z` tag and attaches them to its GitHub Release. Normally started by
# release-please.yml: merging the release PR makes release-please create the tag and the release (turned back
# into a draft at once), and that workflow then dispatches this one on the tag ref with dry_run=false. It has to
# dispatch: a tag created with GITHUB_TOKEN triggers no `push` workflow. A tag pushed by hand (or by a PAT) still
# starts it through `push`. See docs/RELEASING.md.
# The Windows
# installer and the macOS .app.tar.gz are signed for the in-app updater; a last job merges the platform
# entries into latest.json, which the app reads from releases/latest/download. macOS is OFF by default
# (no Apple Developer account): the Mac legs only exist when the repository variable RELEASE_MACOS is
# 'true'. Then the app is signed with a Developer ID and notarized, and a real release FAILS if the Apple
# secrets are missing (a dry run only warns and builds unsigned). latest.json lists only the platforms that
# were built. See docs/RELEASING.md for key custody, rotation and the setup.
#
# Signing secrets live in the protected GitHub Environment `release` (required reviewers, deployment
# branches/tags limited to `v*`), not in repository secrets: TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD; APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific password) and APPLE_TEAM_ID.
# Optional, Windows Authenticode (docs/SIGNING.md): SignPath Foundation with SIGNPATH_API_TOKEN and
# SIGNPATH_ORGANIZATION_ID (preferred; slugs in the repository variables SIGNPATH_PROJECT_SLUG,
# SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_ARTIFACT_CONFIGURATION_SLUG; the artifact configuration is
# .signpath/artifact-configuration.xml), else Azure Artifact Signing (formerly Trusted Signing) with
# AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, TS_ENDPOINT, TS_ACCOUNT, TS_PROFILE. With neither
# set the Windows build is unsigned, as before.
# The final `publish` job uses the Environment `release-publish` (add a reviewer there for a manual gate).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; keep the installer on the run, publish nothing (off = a real release, needs a vX.Y.Z tag as the ref)
        type: boolean
        default: true
permissions: { contents: write }
jobs:
  # a tag only releases what is on main: refuse a tag whose commit is not an ancestor of origin/main
  gate:
    name: tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      # a real (not dry) run publishes under the ref's name, so it must be a release tag
      - name: A real release runs on a vX.Y.Z tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::a release needs a vX.Y.Z tag as the ref (got $GITHUB_REF_TYPE $GITHUB_REF_NAME); use dry_run for anything else"
            exit 1
          fi
      - name: Tag commit is an ancestor of origin/main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          fi
  # the full CI (fmt, clippy, audit, host, frontend, version fields) must be green for this commit
  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
  # one job creates the draft release, so the matrix jobs only ever upload into it
  draft:
    name: draft release
    needs: [gate, ci]
    # a real release: a tag push, or the dispatch from release-please.yml (dry_run=false on the tag ref)
    if: ${{ github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - name: Changelog
        run: |
          # the commit subjects since the previous release tag
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's changed"
            echo
            if [[ -n "$PREV" ]]; then git log --no-merges --pretty='- %s' "$PREV..HEAD"; else git log --no-merges -n 20 --pretty='- %s'; fi
            if [[ -n "$PREV" ]]; then echo; echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$PREV...${GITHUB_REF_NAME}"; fi
          } > notes.md
          cat notes.md
      # git-cliff groups the commit subjects (cliff.toml). Any failure falls back to the plain list above.
      - name: Changelog (git-cliff)
        id: cliff
        continue-on-error: true
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: cliff-notes.md
      - name: Use the git-cliff notes
        if: steps.cliff.outcome == 'success'
        run: |
          if [[ -s cliff-notes.md ]] && grep -q '^- ' cliff-notes.md; then
            PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              echo "## What's changed"
              echo
              cat cliff-notes.md
              if [[ -n "$PREV" ]]; then echo; echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$PREV...${GITHUB_REF_NAME}"; fi
            } > notes.md
          else
            echo "::warning::git-cliff produced no notes, keeping the plain commit list"
          fi
          cat notes.md
      - name: Create the draft
        run: |
          V="${GITHUB_REF_NAME#v}"
          # a re-run reuses its own draft; an already published release is an error. The draft release-please
          # made already has its changelog section as the body: keep it, the notes above are only the fallback.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]] || { echo "::error::$GITHUB_REF_NAME is already published"; exit 1; }
            if [[ -n "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body | tr -d '[:space:]')" ]]; then
              gh release edit "$GITHUB_REF_NAME" --title "Axelstra $V"
            else
              gh release edit "$GITHUB_REF_NAME" --title "Axelstra $V" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Axelstra $V" --notes-file notes.md
          fi
  release:
    name: release (${{ matrix.key }})
    needs: [gate, ci, draft]
    # draft is skipped on a dry run, which is fine
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.ci.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is built only when the repository variable RELEASE_MACOS is 'true' (Apple signing set up, see
        # docs/RELEASING.md); otherwise the matrix is Windows alone and the Mac legs do not exist. Once enabled,
        # darwin-aarch64 is required (its failure fails `release`, so nothing publishes); the Intel mac, built
        # natively, is experimental: a failure there does not block the release, latest.json just has no
        # darwin-x86_64 entry (Intel installs get no update until it ships).
        include: ${{ fromJSON(vars.RELEASE_MACOS == 'true' && '[{"os":"windows-latest","key":"windows-x86_64","experimental":false},{"os":"macos-latest","key":"darwin-aarch64","experimental":false},{"os":"macos-15-intel","key":"darwin-x86_64","experimental":true}]' || '[{"os":"windows-latest","key":"windows-x86_64","experimental":false}]') }}
    # Swap for the self-hosted runner label if the repo gets access to one.
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # the signing secrets are Environment secrets: reviewers and tag rules of `release` apply here
    environment: release
    # room for two SignPath approvals (each waits up to 30 min) on top of the build
    timeout-minutes: 150
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # secrets cannot appear in a step `if:`; these booleans can (the values never reach a log)
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
      HAS_ARTIFACT_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.TS_ENDPOINT != '' && secrets.TS_ACCOUNT != '' && secrets.TS_PROFILE != '' }}
      # Release binaries keep line tables and are not stripped here, so rustc emits .pdb (Windows) and
      # .dSYM (macOS) next to them; they are uploaded as a workflow artifact below. Cargo.toml keeps
      # `strip = true` for local builds (on MSVC, strip suppresses the .pdb altogether).
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - name: Stamp the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then node scripts/stamp-version.mjs --tag "$GITHUB_REF_NAME"; else node scripts/stamp-version.mjs --check; fi
      # Build metadata shown in Settings > About and `axelstra --version`. The sha comes from the event (a
      # shallow checkout has no usable `git rev-parse` fallback guarantee), the date is UTC.
      - name: Build metadata
        shell: bash
        run: |
          echo "AXELSTRA_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "AXELSTRA_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --no-fail-fast -p axelstra-core -p axelstra-daemon -p axelstra
      - run: npm ci
        working-directory: app
      # the installer must not ship a frontend that fails its own checks
      - run: npx tsc --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "bad tag $GITHUB_REF_NAME"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Daemon sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/prepare-sidecar.ps1
      - name: Daemon sidecar (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/prepare-sidecar.sh

      # No silent unsigned Mac: a real release without the Apple secrets fails here. A dry run only warns.
      - name: Check the Apple signing secrets (macOS)
        if: runner.os == 'macOS'
        id: apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!v}" ]] || MISSING="$MISSING $v"
          done
          if [[ -z "$MISSING" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::Apple secrets missing ($MISSING ): dry run builds an UNSIGNED app"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Apple secrets missing in the 'release' environment:$MISSING. Refusing to ship an unsigned macOS app."
            exit 1
          fi

      # Windows Authenticode is optional (docs/SIGNING.md): SignPath Foundation when its secrets exist, else Azure
      # Artifact Signing, else none. With a provider the build is split so every shipped .exe is signed before
      # the installer packs it: `tauri build --no-bundle` (app exe; the sidecar is already built), sign
      # axelstra-app.exe and the axelstra.exe sidecar, `tauri bundle` (NSIS + updater .sig), sign the installer,
      # re-sign the updater .sig. A provider that is configured but fails stops the release: no half-signed build.
      - name: Authenticode provider (Windows)
        id: sign
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ "$HAS_SIGNPATH" == "true" ]]; then P=signpath
          elif [[ "$HAS_ARTIFACT_SIGNING" == "true" ]]; then P=artifact-signing
          else P=none; echo "::notice::no Authenticode secrets in the 'release' environment: the Windows build is unsigned (docs/SIGNING.md)"
          fi
          echo "Authenticode provider: $P"
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          # the version stamped into the files (0.1.0-style even on a dry run), passed to SignPath, whose artifact
          # configuration requires this exact product version on every signed file
          echo "file_version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the installer (Windows, unsigned)
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'none'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      - name: Build the app, no bundle yet (Windows, signed)
        if: runner.os == 'Windows' && steps.sign.outputs.provider != 'none'
        working-directory: app
        run: npx tauri build --no-bundle --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      # The bundler takes the sidecar from app/src-tauri/binaries (file name with the target triple) and the app
      # from target/release, so those are the copies that get signed.
      - name: Stage the binaries for signing (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.provider != 'none'
        shell: bash
        run: |
          mkdir -p sign-in/binaries
          cp target/release/axelstra-app.exe sign-in/binaries/
          cp app/src-tauri/binaries/axelstra-x86_64-pc-windows-msvc.exe sign-in/binaries/
          ls -l sign-in/binaries
      - name: Upload the binaries for SignPath (Windows)
        id: sp_bin
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'signpath'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-binaries-${{ matrix.key }}
          path: sign-in/binaries/
          if-no-files-found: error
          retention-days: 1
      - name: Sign the binaries (Windows, SignPath)
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'axelstra' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows' }}
          parameters: |
            version: "${{ steps.sign.outputs.file_version }}"
          github-artifact-id: ${{ steps.sp_bin.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: sign-out/binaries
      - name: Sign the binaries (Windows, Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.TS_ENDPOINT }}
          signing-account-name: ${{ secrets.TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TS_PROFILE }}
          files-folder: ${{ github.workspace }}\sign-in\binaries
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Put the signed binaries back and verify them (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.provider != 'none'
        shell: pwsh
        env:
          PROVIDER: ${{ steps.sign.outputs.provider }}
        run: |
          # SignPath returns signed copies in sign-out; Artifact Signing signs in place
          $src = if ($env:PROVIDER -eq 'signpath') { 'sign-out/binaries' } else { 'sign-in/binaries' }
          Copy-Item "$src/axelstra-app.exe" target/release/axelstra-app.exe -Force
          Copy-Item "$src/axelstra-x86_64-pc-windows-msvc.exe" app/src-tauri/binaries/axelstra-x86_64-pc-windows-msvc.exe -Force
          foreach ($f in 'target/release/axelstra-app.exe', 'app/src-tauri/binaries/axelstra-x86_64-pc-windows-msvc.exe') {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Host "::error::$f is not validly signed ($($s.Status))"; exit 1 }
          }
      - name: Bundle the signed binaries (Windows, signed)
        if: runner.os == 'Windows' && steps.sign.outputs.provider != 'none'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri bundle --bundles nsis --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      # macOS: the .app.tar.gz is what the in-app updater downloads, the .dmg is the first install.
      # Signed with the Developer ID and notarized (the check above fails a real release without the secrets);
      # the unsigned build below only ever runs on a dry run.
      - name: Build the app and disk image (macOS, signed)
        if: runner.os == 'macOS' && steps.apple.outputs.ok == 'true'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      - name: Build the app and disk image (macOS, unsigned, dry run only)
        if: runner.os == 'macOS' && steps.apple.outputs.ok != 'true'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json --config '{"version":"${{ steps.v.outputs.version }}","bundle":{"createUpdaterArtifacts":true}}'
      # The app links the sherpa speech engine statically, so the bundle must hold no loose .dylib. If one ever
      # appears it has to carry the same team ID as the app, because the entitlement
      # com.apple.security.cs.disable-library-validation is NOT granted (see docs/RELEASING.md).
      - name: Verify the macOS signature
        if: runner.os == 'macOS' && steps.apple.outputs.ok == 'true'
        shell: bash
        run: |
          APP=$(ls -d target/release/bundle/macos/*.app | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          TEAM=$(codesign -dv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          echo "app team id: $TEAM"
          [[ -n "$TEAM" && "$TEAM" != "not set" ]] || { echo "::error::app has no team id"; exit 1; }
          if codesign -d --entitlements - "$APP" 2>&1 | grep -q 'disable-library-validation'; then
            echo "::error::disable-library-validation is set on the signed app"; exit 1
          fi
          while IFS= read -r lib; do
            T=$(codesign -dv "$lib" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            [[ "$T" == "$TEAM" ]] || { echo "::error::$lib has team id '$T', expected '$TEAM'"; exit 1; }
            echo "ok $lib"
          done < <(find "$APP" \( -name '*.dylib' -o -name '*.so' \))

      # The installer itself, after `tauri bundle` wrote it with the signed binaries inside.
      - name: Upload the installer for SignPath (Windows)
        id: sp_inst
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'signpath'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer-${{ matrix.key }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer (Windows, SignPath)
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'axelstra' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows' }}
          parameters: |
            version: "${{ steps.sign.outputs.file_version }}"
          github-artifact-id: ${{ steps.sp_inst.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: sign-out/installer
      - name: Put the signed installer back (Windows, SignPath)
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'signpath'
        shell: bash
        run: |
          for f in sign-out/installer/*-setup.exe; do cp "$f" target/release/bundle/nsis/; done
      - name: Sign the installer (Windows, Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.sign.outputs.provider == 'artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.TS_ENDPOINT }}
          signing-account-name: ${{ secrets.TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TS_PROFILE }}
          files-folder: ${{ github.workspace }}\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The installer must be signed, and so must the two programs inside it (7-Zip reads NSIS installers).
      - name: Verify the Authenticode signatures (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.provider != 'none'
        shell: pwsh
        run: |
          $bad = 0
          $inst = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          foreach ($f in $inst) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name) : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Host "::error::$($f.Name) is not validly signed ($($s.Status))"; $bad = 1 }
          }
          $x = Join-Path $env:RUNNER_TEMP 'installer-content'
          & 7z x -y "-o$x" $inst[0].FullName | Out-Null
          foreach ($n in 'axelstra-app.exe', 'axelstra.exe') {
            $f = Get-ChildItem -Path $x -Recurse -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $f) { Write-Host "::warning::could not read $n out of the installer to check its signature"; continue }
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "installer/$n : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Host "::error::$n inside the installer is not validly signed ($($s.Status))"; $bad = 1 }
          }
          exit $bad
      # The updater .sig covers the exact installer bytes and Authenticode changed them: sign again. A stale .sig
      # would break every update, so this step fails the job.
      - name: Re-sign the signed installer for the updater (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.provider != 'none'
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in ../target/release/bundle/nsis/*-setup.exe; do npx tauri signer sign "$f"; done

      - name: Collect debug symbols
        shell: bash
        run: |
          mkdir -p symbols
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/*.pdb symbols/ 2>/dev/null || true
          else
            cp -R target/release/*.dSYM symbols/ 2>/dev/null || true
          fi
          ls -l symbols || true
      # Workflow artifacts are readable by anyone who can read this repo: no secrets belong in symbols.
      - name: Keep the debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-${{ matrix.key }}-${{ steps.v.outputs.version }}
          path: symbols/
          if-no-files-found: warn
          retention-days: 90

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          KEY="${{ matrix.key }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/bundle/nsis/*-setup.exe out/
            FILE=$(basename out/*-setup.exe)
            cp "target/release/bundle/nsis/$FILE.sig" "out/$FILE.sig"
          else
            cp target/release/bundle/dmg/*.dmg out/
            # Tauri names the updater archive Axelstra.app.tar.gz for every arch: add the arch so the Intel
            # and Apple silicon files do not overwrite each other on the release
            SRC=$(basename target/release/bundle/macos/*.app.tar.gz)
            FILE="Axelstra_${{ steps.v.outputs.version }}_${KEY#darwin-}.app.tar.gz"
            cp "target/release/bundle/macos/$SRC" "out/$FILE"
            cp "target/release/bundle/macos/$SRC.sig" "out/$FILE.sig"
          fi
          # this platform's entry for latest.json, merged by the manifest job once every platform is up
          node scripts/write-latest-json.mjs --fragment --key "$KEY" --sig-file "out/$FILE.sig"             --url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME:-v0.0.0}/$FILE" --out "out/platform-$KEY.json"
          ls -l out
      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the draft job created the release; errors here are real. --clobber only ever replaces assets of
          # this still-draft release (a re-run); a published release is immutable, so refuse to touch it.
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]] || { echo "::error::$GITHUB_REF_NAME is already published; assets are immutable"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Keep the dry-run installer on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axelstra-dry-run-${{ matrix.key }}
          path: out/
          retention-days: 7

  # EXPERIMENTAL: Linux is not a supported platform yet. This job only proves a .deb and an AppImage can be built;
  # it never blocks the release, and the files are not signed for the updater, so latest.json has no Linux entry
  # (a Linux install does not update itself). Nobody has run the result on a Linux desktop.
  linux:
    name: release (linux, experimental)
    # after the main jobs, which create the release and write its notes
    needs: [release, draft]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - name: Stamp the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then node scripts/stamp-version.mjs --tag "$GITHUB_REF_NAME"; else node scripts/stamp-version.mjs --check; fi
      # Build metadata shown in Settings > About and `axelstra --version`. The sha comes from the event (a
      # shallow checkout has no usable `git rev-parse` fallback guarantee), the date is UTC.
      - name: Build metadata
        shell: bash
        run: |
          echo "AXELSTRA_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "AXELSTRA_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Desktop toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: cargo test --no-fail-fast -p axelstra-core -p axelstra-daemon -p axelstra
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Version
        id: v
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Daemon sidecar
        run: sh scripts/prepare-sidecar.sh
      - name: Build the .deb and the AppImage
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.linux.conf.json --config '{"version":"${{ steps.v.outputs.version }}"}'
      - name: Stage artifacts
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb out/
          cp target/release/bundle/appimage/*.AppImage out/
          ls -l out
      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]] || { echo "::error::$GITHUB_REF_NAME is already published; assets are immutable"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Keep the dry-run files on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axelstra-dry-run-Linux
          path: out/
          retention-days: 7

  # latest.json goes last: clients only see a version once every installer is already there.
  # On a dry run it merges the fragments kept on the run, so the merge is tested without a release.
  manifest:
    name: latest.json
    needs: release
    # only the platforms that were built have a platform-*.json: a Mac leg that did not run (variable unset) or
    # an experimental one that failed simply leaves no fragment, and the merge globs what is there
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - name: Merge the platform entries
        if: env.DRY_RUN != 'true'
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir frag
          gh release download "$GITHUB_REF_NAME" --pattern 'platform-*.json' --dir frag
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          node scripts/write-latest-json.mjs --version "$V" --notes-file notes.md --out latest.json frag/platform-*.json
          cat latest.json
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]] || { echo "::error::$GITHUB_REF_NAME is already published; latest.json is immutable"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          for f in frag/platform-*.json; do gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$f")" --yes; done
      - name: Fetch the dry-run fragments
        if: env.DRY_RUN == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: axelstra-dry-run-*
          path: dry
          merge-multiple: true
      - name: Merge the platform entries (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          mkdir frag
          cp dry/platform-*.json frag/
          echo "dry run" > notes.md
          node scripts/write-latest-json.mjs --version 0.0.0 --notes-file notes.md --out latest.json frag/platform-*.json
          cat latest.json
      - name: Keep the dry-run manifest on the run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axelstra-dry-run-manifest
          path: latest.json
          retention-days: 7

  # the release stays a draft until every installer and latest.json are on it
  publish:
    name: publish release
    needs: [manifest, linux]
    # waits for linux to finish but tolerates its failure (experimental); manifest must have succeeded
    if: ${{ !cancelled() && github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && needs.manifest.result == 'success' && contains(fromJSON('["success","failure","skipped"]'), needs.linux.result) }}
    runs-on: ubuntu-latest
    # last gate before clients see the release: put a required reviewer on this Environment
    environment: release-publish
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
