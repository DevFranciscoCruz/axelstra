<style>
:root{--bg:#1e1f23;--panel:#24262c;--line:#33363f;--line-2:#3a3a45;--line-3:#43434f;--text:#d7dae0;--muted:#9aa0b2;--accent:#a78bfa;--on-accent:#15121f;--ok:#4ade80;--warn:#e5c07b;--bad:#f87171;--await:#5eb8d6;--s3:#2a2a32;--s-in:#22222a;--s-code:#1b1b21}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#14151a;display:grid;place-items:center;font:13px/1.4 "Inter Variable","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--text)}
#win{width:1280px;height:720px;background:var(--bg);border:1px solid var(--line-3);border-radius:10px;overflow:hidden;position:relative;display:grid;grid-template-rows:1fr 26px}
.cols{display:grid;grid-template-columns:250px 1fr 310px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:0}
.brand{font-weight:700;font-size:14px;padding:2px 4px 4px}
.addp{border:0;background:var(--accent);color:#1a1530;border-radius:6px;padding:6px 8px;font:inherit;font-weight:600;text-align:center;margin-bottom:4px}
.sec{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 4px 2px}
.proj{margin-bottom:6px}
.ph{display:flex;align-items:center;gap:6px;padding:4px;font-weight:600}
.pi{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.sp{flex:1}.ic{color:var(--muted);font-size:14px;padding:0 4px}

.term .u{color:var(--text)}.term .m{color:var(--muted)}.term .g{color:var(--ok)}.term .a{color:var(--accent)}

.kt{font-weight:600;font-size:12.5px}.kb{color:var(--muted);font-size:11.5px}.chips{display:flex;gap:5px;flex-wrap:wrap}

.ib{color:var(--muted);padding:2px 6px;border-radius:4px}.ib.press{background:#3a3d4a;color:var(--text)}
.dcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}

.links div.on{background:#2f323b;color:var(--text);border-radius:6px}

.dot.wait{background:var(--warn)}.chev{color:var(--muted);font-size:10px;width:10px;display:inline-block}
.nest{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}

.cw{position:relative;display:flex;align-items:center}.cwb{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:5px}.cwb.open{background:#3a3d4a;color:var(--text)}
.pop{position:absolute;bottom:calc(100% + 8px);left:0;width:300px;background:#2a2a32;border:1px solid var(--line-3);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45);color:var(--text);z-index:5}
.pop .gh{font-size:11px;color:var(--muted);padding:4px 0 2px}.pop .ent{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}.pop .ent .w{margin-left:auto;color:var(--muted);font-size:11px}
.pop table{width:100%;border-collapse:collapse;font-size:12px}.pop th{font-weight:400;text-align:left;padding:2px 0}.pop td,.pop thead th+th{text-align:right;color:var(--muted)}.pop thead th{font-size:11px;color:var(--muted)}
.pop .btn{margin-top:6px;border:1px solid var(--line-3);border-radius:6px;padding:4px;text-align:center}
.pop.r{left:auto;right:-60px;width:330px}.nit{display:flex;flex-direction:column;gap:1px;padding:6px 6px;border-radius:6px}.nit.fresh{background:#303342}.nit .k{font-size:11px;font-weight:600}.nit .k.ok{color:var(--ok)}.nit .k.w{color:var(--warn)}.nit .k.m{color:var(--accent)}.nit .x{font-size:12px}.nit .mt{font-size:11px;color:var(--muted)}
.bell{position:relative;color:var(--muted)}.bell i{position:absolute;top:-3px;right:-5px;background:var(--accent);color:#1a1530;border-radius:8px;font-size:9px;font-style:normal;font-weight:700;padding:0 4px}

.dk .srch{flex:1;border:1px solid var(--line-3);border-radius:6px;padding:4px 8px;color:var(--muted)}
.dk .navc{display:flex;gap:14px;padding:8px 14px;color:var(--muted);border-bottom:1px solid var(--line)}.dk .navc .on{color:var(--text);border-bottom:2px solid var(--accent)}
.dk .cb{display:flex;align-items:center;gap:10px;margin:10px 14px 4px;padding:6px 10px;background:#24242a;border:1px solid var(--line);border-radius:8px}
.dr{display:grid;grid-template-columns:90px 1fr 190px 60px 80px;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line)}.dr.sel{background:#2a2c35}.dr .ds{display:flex;align-items:center;gap:6px}.dr small{display:block;color:var(--muted)}.dr .num{color:var(--muted);text-align:right}
.pt{display:inline-block;border:1px solid var(--line-3);border-radius:9px;padding:0 7px;font-size:11px;margin-right:4px;color:#8ab4ff}
.dtabs{display:flex;gap:4px;padding:8px 14px 0}.dtabs span{padding:3px 10px;border-radius:6px;color:var(--muted)}.dtabs span.on{background:#2f323b;color:var(--text)}
.dpre{margin:8px 14px;padding:10px 12px;background:#17181c;border:1px solid var(--line);border-radius:8px;font:12px/1.55 "Cascadia Mono",Consolas,monospace;color:#b9bdc9;flex:1;overflow:hidden}
.ship{border-bottom:1px solid var(--line);padding-bottom:8px}.ship .sct{display:flex;padding:8px 10px 4px;font-size:10px;letter-spacing:.08em;color:var(--muted)}.ship .sct b{font-weight:600;flex:1}.ship .sct .ci{color:var(--ok);font-weight:600;letter-spacing:0;font-size:11px}

.ship .acts{display:flex;gap:6px;padding:4px 10px}.ship .acts span{border:1px solid var(--line-3);border-radius:6px;padding:4px 10px;font-size:12px}.ship .acts span.p{background:var(--accent);color:#1a1530;border:0;font-weight:600}.ship .acts span.press{filter:brightness(1.3)}

.dot.await{background:var(--await)}.dot.await.p{box-shadow:0 0 0 3px rgba(94,184,214,.25)}

.pane{display:flex;flex-direction:column;gap:8px;min-width:0}.lbl{font-size:11px;color:var(--muted)}

<body>
<div id="win">
  <div class="cols">
    <aside class="side">
      <div class="brand">Axelstra</div>
      <div class="addp">+ Adicionar projeto</div>

      <div id="projects"></div>
      <div class="links"><div id="lk-auto"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg> Automatizações</div><div id="lk-disp"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="5.5" r="1.5"/><path d="M4.5 5v6M11.5 7c0 2.5-3 2.5-6.5 4"/></svg> Despachante</div><div id="lk-set"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2"/></svg> Definições</div></div>

<script>
const TAIL = 38500;
const TAIL2 = 55500; // scenes after the merge flow: add project, awaiting, kanban drag, path confirm
const SCRIPT = 70500; // length of the script in its own ms
const SPEED = 1.15; // the recorder plays the script this much faster so the whole loop stays near a minute
const TOTAL = Math.round(SCRIPT / SPEED);
const NEW = "promo-codes";
const COMMIT_MSG = "feat(theme): add dark mode toggle to settings";
const spin = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
const $ = (id) => document.getElementById(id);
const typed = (s, t, start, speed) => s.slice(0, Math.max(0, Math.min(s.length, Math.floor((t - start) / speed))));

// terminal transcripts: [appears at ms, html]
const PROMO = [
  [3900, '<span class="a">&gt;</span> Add validation for EU promo codes at checkout'],
  [5600, '<span class="m">● I\'ll start with the existing promo helper.</span>'],
  [6400, '<span class="m">  Ran 1 shell command</span>'],
  [7200, '● Update(src/lib/promo.ts)'],

  const cols = [["backlog", "Ideias", "#8a8aa0"], ["todo", "Para fazer", "#6aa3ff"], ["in-progress", "Em curso", "#e5c07b"], ["needs-review", "Rever", "#c792ea"], ["done", "Feito", "#4ade80"]];
  const cards = [
    { id: "csv-export", title: "Exportar relatórios em CSV", body: "Botão no ecrã de relatórios, só colunas visíveis.", status: "backlog", drag: true },
    { id: "welcome-mail", title: "Email de boas-vindas", body: "", status: "backlog" },
    { id: "rate-limit", title: "Rate limit na API", body: "Limitar a 100 pedidos por minuto por chave e devolver 429 com Retry-After.", status: "todo", pri: 1 },
    { id: "invoices", title: "Página de faturas", body: "Lista paginada com download em PDF e filtro por estado.", status: "todo" },
    { id: "dark-mode", title: "Dark mode toggle", body: "", status: "done" },
  ];
  const A = 800, B = 1900, C = 2000; // grab, arrive, drop (ms since the scene started)
  const dragging = r >= A && r < C, dropped = r >= C;
  const html = (c, color, cls) => `<div class="kcard${cls ? " " + cls : ""}" style="--st:${color}"><div class="kt">${c.title}</div>${c.body ? `<div class="kb">${c.body}</div>` : ""}<div class="chips"><span class="chip">claude</span>${c.pri ? '<span class="chip hi">prio 1</span>' : ""}<span class="chip">${c.id}</span></div></div>`;
  const colOf = (c) => (c.drag && dropped ? "todo" : c.status);
  const over = dragging && r >= 1300;
  const body = cols.map(([id, label, color]) => {
    const cs = cards.filter((c) => colOf(c) === id && !(c.drag && dragging)).sort((a, b) => !!(a.drag && dropped) - !!(b.drag && dropped));
    const n = cs.length + (dragging && id === "backlog" ? 1 : 0);
    let inner = cs.map((c) => html(c, color)).join("");
    if (dragging && id === "backlog") inner = html(cards[0], color, "gh") + inner;
    if (over && id === "todo") inner += '<div class="kcard slot"></div>';
    return `<div class="kcol${over && id === "todo" ? " over" : ""}"><div class="kch">${label} <i>${n}</i></div>${inner}</div>`;
  }).join("");
  const note = dropped && r >= 2300 ? "csv-export passou para “Para fazer”" : "";
  return {
    html: `<div class="kbar"><b>Kanban</b><span style="flex:1"></span><span class="kbtn">Executar “Para fazer”</span></div>${note ? `<div class="krun">${note}</div>` : ""}<div class="kcols">${body}</div>`,
    float: (kan) => {
      const k = kan.getBoundingClientRect();
      const src = kan.querySelector(".kcard.gh"), dst = kan.querySelector(".kcard.slot");
      const cur = document.createElement("div");
      cur.className = "cur";
      cur.innerHTML = SVG('<path d="M3 2l9 5.2-3.9 1.1L10 13l-1.8.8-1.9-4.7L3 11.5z" fill="#fff" stroke="#111" stroke-width="1"/>', 22);
      if (!src) {
        const q = r < A ? kan.querySelector(".kcard").getBoundingClientRect() : null;
        if (q) { cur.style.left = q.left - k.left + 80 + "px"; cur.style.top = q.top - k.top + 30 + "px"; kan.appendChild(cur); }
        return;
      }
      const s = src.getBoundingClientRect(), d = dst ? dst.getBoundingClientRect() : s;
      const u = Math.min(1, Math.max(0, (r - A - 150) / (B - A - 150)));
      const e = u * u * (3 - 2 * u);
      const x = s.left - k.left + (d.left - s.left) * e, y = s.top - k.top + (d.top - s.top) * e;
      const f = src.cloneNode(true);
      f.className = "kcard lift";
      f.style.left = x + "px";
      f.style.top = y + "px";
      kan.appendChild(f);
      cur.style.left = x + 90 + "px";
      cur.style.top = y + 34 + "px";
      kan.appendChild(cur);
    },
  };
}

function tail2Render(t, pulse) {
  const r = t - TAIL2;
  const scene = r < 5000 ? "add" : r < 8000 ? "await" : r < 11500 ? "kan" : "path";
  tailRender(38600 + (t % 1400), r >= 6800);
  const term = $("term");
  const modal = $("modal");
  const showModal = (h) => { modal.style.display = "grid"; modal.innerHTML = h; };
  document.querySelector(".addp").classList.toggle("press", r >= 100 && r < 400);
  if (scene === "add") {
    if (r >= 300) showModal(addModal(r, pulse));
  } else term.innerHTML = awTerm(r);
  if (r >= 7000 && r < 8300) {
    const h = document.createElement("div");
    h.className = "tip";
    h.innerHTML = "<b>À espera de algo externo:</b> CI #3703 (há 4 s) · expira 14:32";
    const row = [...document.querySelectorAll(".ag")].find((e) => e.textContent.includes("Tarefa 1"));
    h.style.top = (row ? row.getBoundingClientRect().top - $("win").getBoundingClientRect().top + 24 : 300) + "px";
    $("win").appendChild(h);
    window.__tip = h;
  }
  if (scene === "kan") {
    const kd = kanDrag(r - 8000);
    const kan = $("kan");
    kan.style.display = "flex";
    kan.innerHTML = kd.html;
    kd.float(kan);
  }
  if (scene === "path") {
    const q = r - 11500;
    const hot = q >= 400;
    const run = q >= 2600;
    const extra = `● Created <span class="pl${hot ? " hot" : ""}">scripts/setup-env.ps1</span>${hot && q < 1000 ? '<span class="key">Ctrl+clique</span>' : ""}<br>` + (run ? '<span class="a">$</span> .\\scripts\\setup-env.ps1<br><span class="g">✓ ambiente pronto</span><br>' : "");
    term.innerHTML = awTerm(r, extra);
    if (q >= 1000 && !run) {
      const full = "C:\\Users\\ana\\Projetos\\acme-web\\.axelstra-wt\\checkout-ui\\scripts\\setup-env.ps1";
      showModal(`<div class="modal mw"><div class="mh"><b>Abrir caminho</b></div><div class="pre">${esc(full)}\n\nTipo: programa ou script\n\nExecutar corre este programa no teu computador, com as tuas permissões. Só o faças se confias nele.</div>
        <div class="mact"><span class="mbtn">Cancelar</span><span class="mbtn">Mostrar na pasta</span><span class="mbtn pr2${q >= 2300 ? " press" : ""}">Executar</span></div></div>`);
    }
  }
}

let pulseNow = true;
function render(t) {
  const pulse = Math.floor(t / 500) % 2 === 0;
  pulseNow = pulse;
  const palOpen = t >= 11000 && t < 12800;
  const sel = t < 3600 ? "dark" : t < 12800 ? "promo" : "dark"; // selected worktree
  const darkDone = t >= 9600;
  const committed = t >= 16300;
  const editorOpen = t >= 21400 && t < 25000;
  const kanOpen = t >= 25400 && t < 30400;
  const autoOpen = t >= 30800 && t < 34600;
  const dispOpen = t >= 34600 && t < 38100;
  const rtab = t < 18000 ? "changes" : t < 20000 ? "pulls" : t < 25000 ? "files" : "changes";

  // sidebar
  let web = row("main", "idle", false);
  web += row("ax/dark-mode", darkDone ? "done" : "work", sel === "dark");
  if (!darkDone) web += agent(t < 2000 ? "4m" : "5m");
  if (t >= 1200 && t < 3000) web += `<div class="input">${typed(NEW, t, 1500, 110)}${pulse ? '<span class="caret"></span>' : ""}</div>`;
  else if (t >= 3000 && t < 3600) web += `<div class="row"><span class="dot work"></span><span class="n" style="color:var(--muted)">A criar ${NEW}…</span></div>`;
  else if (t >= 3600) web += row("ax/" + NEW, "work", sel === "promo") + agent(t < 9000 ? "agora" : "1m");
  $("projects").innerHTML = proj("#6366f1", "acme-web", web) + proj("#0ea5e9", "acme-api", row("main", "idle", false));
  $("lk-auto").classList.toggle("on", autoOpen);
  $("lk-disp").classList.toggle("on", dispOpen);

  // terminal or editor
  const dev = t >= 4600;
  $("tabs").innerHTML = `<span class="tab on">claude</span>${dev ? '<span class="tab">pnpm dev</span>' : ""}<span class="sp"></span><span class="ic">⌕</span>`;
  const term = $("term");
  if (editorOpen) {
    term.style.padding = "0";
    term.innerHTML = codeView(t);
  } else {
    term.style.padding = "";
    let out;
    if (sel === "promo") {
      out = `<span class="m">ax/${NEW} · claude</span><br>`;
      for (const [at, h] of PROMO) if (t >= at) out += h + "<br>";
      if (t >= 4400 && t < 8900) out += `<span class="a">${spin[Math.floor(t / 90) % spin.length]}</span> <span class="m">Thinking…</span>`;
    } else {
      out = `<span class="m">ax/dark-mode · claude</span><br>`;
      for (const [at, h] of DARK) if (t >= at) out += h + "<br>";
      if (!darkDone) out += `<span class="a">${spin[Math.floor(t / 90) % spin.length]}</span> <span class="m">Thinking…</span>`;
    }
    term.innerHTML = out;
  }

  // right panel
  let files;
  if (sel === "promo") {
    files = [];
    if (t >= 7600) files.push(["M", "src/lib/promo.ts", "+42 −3"]);
    if (t >= 8400) files.push(["A", "src/lib/promo.test.ts", "+60"]);
  } else files = committed ? [] : [["M", "src/theme.ts", "+18 −2"], ["M", "src/Settings.tsx", "+24 −1"]];
  const n = files.length;
  const cls = (id) => (rtab === id ? " on" : "");
  $("rtabs").innerHTML = `<span class="rtab${cls("files")}">Ficheiros</span><span class="rtab${cls("changes")}">Alterações${n ? " " + n : ""}</span><span class="rtab${cls("pulls")}">PRs</span>`;
  let body;
  if (rtab === "pulls") {
    body = `<div class="pr"><b>#42 Add dark mode toggle</b><span>ax/dark-mode → main · <span class="ok">checks passed</span></span></div>
            <div class="pr"><b>#41 Fix invoice rounding</b><span>ax/invoice-fix → main · aberto há 2 dias</span></div>`;
  } else if (rtab === "files") {
    const hi = t >= 21000 ? ' style="background:#2f323b;border-radius:4px"' : "";
    const tw = (o) => `<span class="tw">${o}</span>`;
    body = `<div class="tree"><div class="rh">ACME-WEB · AX/DARK-MODE</div>
      <div class="f">${tw("▾")}${FOLDER}<span class="nm">src</span></div>
      <div class="f k">${tw("")}${FILE}<span class="nm">Settings.tsx</span></div>
      <div class="f k"${hi}>${tw("")}${FILE}<span class="nm">theme.ts</span></div>
      <div class="f k">${tw("")}${FILE}<span class="nm">main.tsx</span></div>
      <div class="f">${tw("▸")}${FOLDER}<span class="nm">public</span></div>
      <div class="f">${tw("")}${FILE}<span class="nm">package.json</span></div>
      <div class="f">${tw("")}${FILE}<span class="nm">README.md</span></div></div>`;
  } else {
    body = `<div class="rh">ALTERAÇÕES</div>`;
    body += n ? files.map((f) => `<div class="f"><span class="s ${f[0]}">${f[0]}</span><span class="nm">${f[1]}</span><span style="color:var(--muted)">${f[2]}</span></div>`).join("") : `<div class="empty">Sem alterações</div>`;
    if (committed) body += `<div class="rh">COMMITS</div><div class="f"><span class="s" style="color:var(--accent)">●</span><span class="nm">${COMMIT_MSG}</span><span style="color:var(--muted)">agora</span></div>`;
    if (sel === "dark") {
      const gen = t >= 13300 && t < 14300;
      const msg = committed ? "" : typed(COMMIT_MSG, t, 14300, 22);
      const ready = n > 0 && msg.length > 0;
      const press = t >= 16000 && t < 16300;
      const sparkPress = t >= 13300 && t < 13600;
      const inner = gen ? '<span style="color:var(--muted)">A gerar mensagem…</span>' : msg || '<span style="color:var(--muted)">Mensagem do commit</span>';
      body += `<div class="cm"><div class="in">${inner}<span class="ai${sparkPress ? " press" : ""}">${SPARK}</span></div><div class="bt${ready ? " on" : ""}${press ? " press" : ""}">Commit</div></div>`;
    }
  }
  $("rbody").innerHTML = body;

  // status bar
  const terms = (t < 3600 ? 2 : 4) + (dev ? 1 : 0) - (t < 3600 ? 0 : 1);
  const ports = t >= 6000 ? 2 : 1;
  const ctx = sel === "promo" ? Math.min(41, 8 + Math.floor((t - 3900) / 250)) : 34;
  $("sb").innerHTML = `<span class="on">☕ On</span><span>▦ 1.2 GB</span><span>▣ 6.4%</span><span>▸ ${terms}</span><span>⚡ ${ports}</span><span class="sp"></span>
    <span class="lim">ctx <span class="lim-bar"><i style="width:${Math.max(8, ctx)}%"></i></span>${Math.max(8, ctx)}%</span>
    <span class="lim"><span class="lim-bar"><i style="width:58%"></i></span>58% used · 5h</span>
    <span class="lim"><span class="lim-bar"><i style="width:41%"></i></span>41% used · semana</span>`;

  $("toast").style.display = t >= 9800 && t < 12000 ? "block" : "none";

  // overlays
  const kan = $("kan");
  kan.style.display = kanOpen ? "flex" : "none";
  if (kanOpen) kan.innerHTML = kanbanView(t);
  const modal = $("modal");
  modal.style.display = autoOpen || dispOpen ? "grid" : "none";
  if (autoOpen) modal.innerHTML = autoModal(t);
  else if (dispOpen) modal.innerHTML = dispModal();

  // command palette
  const pal = $("pal");
  if (palOpen) {
    const q = typed("dark", t, 11300, 130);
    const items = q ? [["ax/dark-mode", "worktree · acme-web"], ["Alternar tema", "ação"]] : [["ax/dark-mode", "worktree · acme-web"], ["ax/promo-codes", "worktree · acme-web"], ["Novo worktree", "ação"], ["Definições", "ação"]];
    pal.style.display = "flex";
    pal.innerHTML = `<div class="pal"><div class="pin">${q || '<span style="color:var(--muted)">Ir para worktree ou executar ação…</span>'}${pulse ? '<span class="caret"></span>' : ""}</div>${items.map((it, i) => `<div class="it${i === 0 ? " on" : ""}"><span>${it[0]}</span><span class="hint">${it[1]}</span></div>`).join("")}</div>`;
  } else pal.style.display = "none";
}

// t is the script's own time; the tooltip of the last frame is dropped before a redraw
const draw = (t) => {
  if (window.__tip) { window.__tip.remove(); window.__tip = null; }
  render(t);
  if (t >= TAIL2) tail2Render(t, Math.floor(t / 500) % 2 === 0);
  else if (t >= TAIL) tailRender(t);
};
window.setT = (ms) => draw(Math.min(SCRIPT - 1, ms * SPEED)); // the recorder's clock is video time
window.TOTAL = TOTAL;
if (!location.search.includes("manual")) {
  const t0 = performance.now();
  const tick = () => { window.setT((performance.now() - t0) % TOTAL); requestAnimationFrame(tick); };
  tick();
} else window.setT(0);
</script>
</body>
</html>
