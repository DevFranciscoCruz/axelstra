[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli", "app/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# Release builds in CI override debug/strip/split-debuginfo through CARGO_PROFILE_RELEASE_* env vars (see
# release.yml) so the .pdb/.dSYM can be archived; `strip = true` here keeps local release builds small
# (and on MSVC it suppresses the .pdb, which is why CI does not use it). Documented in docs/RELEASING.md.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Dev and test builds: full debuginfo (the default, debug = 2) is the biggest part of target/ and of link time. Line tables
# keep backtraces and panic locations with file:line; only stepping through locals in a debugger is lost.
# Dev profile also feeds `cargo test`. Does not touch [profile.release].
[profile.dev]
debug = "line-tables-only"

# Dependencies are rarely debugged: no debuginfo at all for them.
[profile.dev.package."*"]
debug = false
