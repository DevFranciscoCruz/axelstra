[package]
name = "axelstra"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axelstra-core = { path = "../core" }
axelstra-daemon = { path = "../daemon" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
