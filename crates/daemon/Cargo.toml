[package]
name = "axelstra-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
axelstra-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
getrandom = "0.2"
ignore = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
